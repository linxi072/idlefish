<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>闲置集 · 运营后台</title>
  <!-- Vue 3 + Element Plus（UMD 全局构建，免打包即可运行） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/element-plus@2.7.0/dist/index.css" />
  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/element-plus@2.7.0/dist/index.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.6.8/dist/axios.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    html, body, #app { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    body { background: #F4F5F7; color: #1A1A1A; }
    .login-wrap { height: 100%; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg,#FFCE3D,#FFB300); }
    .login-card { width: 420px; background: #fff; border-radius: 16px; padding: 40px 36px; box-shadow: 0 20px 60px rgba(0,0,0,.18); }
    .login-brand { display: flex; align-items: center; font-size: 24px; font-weight: 700; color: #5A4000; }
    .logo { width: 48px; height: 48px; line-height: 48px; text-align: center; background: linear-gradient(135deg,#FFCE3D,#FFB300); border-radius: 12px; color: #fff; margin-right: 12px; }
    .login-sub { color: #9A9A9A; font-size: 13px; margin: 6px 0 24px; }
    .login-tip { color: #9A9A9A; font-size: 12px; margin-top: 16px; text-align: center; }
    .layout { display: flex; height: 100%; }
    .sidebar { width: 220px; background: #1A1A1A; color: #fff; display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; padding: 20px; font-weight: 700; font-size: 18px; color: #FFCE3D; }
    .brand .logo { color: #1A1A1A; }
    .brand-name { margin-left: 10px; }
    .menu { background: transparent !important; border-right: none; flex: 1; }
    .menu .el-menu-item { color: #C4C4C4; height: 52px; }
    .menu .el-menu-item.is-active { background: linear-gradient(90deg,#FFCE3D,#FFB300) !important; color: #1A1A1A !important; font-weight: 700; border-radius: 0 24px 24px 0; }
    .m-icon { margin-right: 10px; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 60px; background: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; box-shadow: 0 2px 8px rgba(0,0,0,.04); }
    .tb-title { font-size: 18px; font-weight: 700; }
    .tb-right { display: flex; align-items: center; }
    .tb-user { margin-right: 16px; color: #666; }
    .content { flex: 1; overflow: auto; padding: 24px; }
    .page-title { font-size: 20px; font-weight: 700; margin: 0 0 16px; }
    .stat-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 16px; }
    .stat-card { background: #fff; border-radius: 12px; padding: 22px; box-shadow: 0 2px 10px rgba(0,0,0,.04); }
    .stat-card.warn { border-left: 4px solid #FFB300; }
    .stat-card.danger { border-left: 4px solid #FF3939; }
    .stat-num { font-size: 30px; font-weight: 700; }
    .stat-card.warn .stat-num { color: #FFB300; }
    .stat-card.danger .stat-num { color: #FF3939; }
    .stat-label { color: #9A9A9A; font-size: 13px; margin-top: 6px; }
    .bars { display: flex; align-items: flex-end; height: 160px; gap: 12px; padding: 10px 0; }
    .bar-item { flex: 1; text-align: center; }
    .bar { background: linear-gradient(180deg,#FFCE3D,#FFB300); border-radius: 6px 6px 0 0; width: 70%; margin: 0 auto; }
    .bar-val { font-size: 11px; color: #666; margin-top: 4px; }
    .bar-x { font-size: 11px; color: #9A9A9A; }
    .todo li { list-style: none; padding: 10px 0; border-bottom: 1px solid #F2F3F5; display: flex; align-items: center; gap: 10px; }
    .todo { padding: 0; margin: 0; }
    .cell-goods { display: flex; align-items: center; }
    .thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; margin-right: 10px; }
    .g-title { font-weight: 600; }
    .g-sub { color: #9A9A9A; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./src/main.js"></script>
  <script>
    // CDN 兜底：若 1.5s 后全局 Vue/ElementPlus 仍未就绪，说明 jsDelivr CDN 加载失败，
    // 展示友好提示避免白屏（生产应改用本地打包构建，避免依赖公共 CDN）。
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (!window.Vue || !window.ElementPlus) {
          var app = document.getElementById('app');
          if (app && !app.childElementCount) {
            app.innerHTML = '<div style="max-width:560px;margin:120px auto;padding:32px;background:#fff;'
              + 'border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.1);text-align:center;color:#1A1A1A;">'
              + '<h2 style="color:#FF3939;">资源加载失败</h2>'
              + '<p style="color:#666;line-height:1.7;">运营后台依赖的 Vue / Element Plus 通过 jsDelivr CDN 加载，'
              + '当前环境可能无法访问外网。</p>'
              + '<p style="color:#9A9A9A;font-size:13px;">建议：① 检查网络后刷新；② 生产部署请改用本地打包构建'
              + '（npm install &amp;&amp; vite build），避免依赖公共 CDN。</p>'
              + '</div>';
          }
        }
      }, 1500);
    });
  </script>
</body>
</html>
