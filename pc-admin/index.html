<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>闲置集 · 运营后台</title>
  <!-- R-23 生产化 · 接口基址外置：生产部署改为真实后端域名（如 https://api.example.com）；
       同时需在本文件 CSP 的 connect-src 中追加该域名，避免被策略拦截。留空则用默认 http://localhost:8080。 -->
  <meta name="api-base" content="" />
  <!-- R-24 联调开关 · 是否使用本地 Mock 数据（无需后端即可完整演示）。
       联调真实后端时改为 content="false"；也可临时用 URL 参数覆盖：index.html?mock=0（优先级高于本 meta）。 -->
  <meta name="use-mock" content="true" />
  <!-- 诊断钩子：将运行时/模块加载/Vue 渲染错误直接渲染到页面顶部，便于无控制台定位白屏根因 -->
  <script>
    window.__showErr = function (msg) {
      var d = document.getElementById('__err_banner');
      if (!d) {
        d = document.createElement('pre');
        d.id = '__err_banner';
        d.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:2147483647;margin:0;background:#fff3f3;color:#c00;' +
          'font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;padding:12px 16px;border-bottom:2px solid #c00;' +
          'white-space:pre-wrap;max-height:60vh;overflow:auto;box-shadow:0 2px 8px rgba(0,0,0,.2)';
        (document.documentElement || document.body).appendChild(d);
      }
      d.textContent += msg + '\n';
    };
    window.addEventListener('error', function (e) {
      window.__showErr('[error] ' + (e.message || (e.error && e.error.stack) || e.error) +
        (e.filename ? ('\n  at ' + e.filename + ':' + e.lineno + ':' + e.colno) : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      window.__showErr('[promise] ' + (r && (r.stack || r.message)) || r);
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <!-- Vite 入口：由 npm 依赖注入 Vue/ElementPlus/ECharts（不再依赖 CDN 全局脚本） -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
