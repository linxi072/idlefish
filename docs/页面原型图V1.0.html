<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闲置集 · 二手交易小程序 高保真原型 V1.0</title>
<style>
:root{
  --xy:#FFCE3D; --xy-deep:#FFB300; --xy-light:#FFF6DA;
  --red:#FF3939; --red-dark:#E52E2E;
  --bg:#F4F5F7; --card:#FFFFFF;
  --t1:#1A1A1A; --t2:#666666; --t3:#9A9A9A; --t4:#C4C4C4;
  --line:#EFEFEF;
  --radius:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:#EDEFF3;color:var(--t1);font-size:14px;
  display:flex;height:100vh;overflow:hidden;
}
::-webkit-scrollbar{width:0;height:0}

/* ============ 左侧页面导航 ============ */
.sidebar{
  width:238px;background:#fff;border-right:1px solid #E3E6EC;
  display:flex;flex-direction:column;flex-shrink:0;
}
.sb-head{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.sb-logo{display:flex;align-items:center;gap:9px}
.sb-logo .mark{
  width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--xy),var(--xy-deep));
  display:flex;align-items:center;justify-content:center;font-size:17px;
}
.sb-logo b{font-size:15.5px;letter-spacing:.3px}
.sb-logo span{font-size:11px;color:var(--t3);display:block;font-weight:400;margin-top:1px}
.sb-body{flex:1;overflow-y:auto;padding:10px 0 20px}
.sb-group{padding:10px 18px 5px;font-size:11px;color:var(--t3);letter-spacing:1.2px;font-weight:600}
.sb-item{
  display:flex;align-items:center;gap:9px;padding:8px 18px;cursor:pointer;
  font-size:13px;color:var(--t2);border-left:3px solid transparent;transition:.16s;
}
.sb-item:hover{background:#F7F8FA;color:var(--t1)}
.sb-item.on{background:var(--xy-light);color:var(--t1);border-left-color:var(--xy);font-weight:600}
.sb-item .n{
  width:19px;height:19px;border-radius:5px;background:#F0F1F4;color:var(--t3);
  font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.sb-item.on .n{background:var(--xy);color:#5A4000}
.sb-foot{padding:12px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--t3);line-height:1.7}

/* ============ 中间舞台 ============ */
.stage{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;min-width:0;padding:16px;
}
.stage-tip{
  position:absolute;top:14px;left:50%;transform:translateX(-50%);
  font-size:11.5px;color:var(--t3);background:rgba(255,255,255,.85);
  padding:5px 14px;border-radius:20px;backdrop-filter:blur(6px);white-space:nowrap;
}
.phone{
  width:375px;height:790px;background:#000;border-radius:46px;
  padding:11px;box-shadow:0 26px 70px rgba(0,0,0,.28),0 3px 12px rgba(0,0,0,.12);
  position:relative;flex-shrink:0;
}
.phone::before{
  content:'';position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:112px;height:26px;background:#000;border-radius:0 0 15px 15px;z-index:30;
}
.screen{
  width:100%;height:100%;background:var(--bg);border-radius:36px;overflow:hidden;position:relative;
}
.screen::-webkit-scrollbar{width:0}
.page{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  background:var(--bg);display:none;
}
.page.on{display:block;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 状态栏 */
.statusbar{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:13px;font-weight:600;flex-shrink:0;position:relative;z-index:20;
}
.statusbar.dark{color:#fff}
.statusbar .icons{display:flex;align-items:center;gap:4px}
.statusbar .icons svg{display:block}

/* 导航栏 */
.navbar{
  height:44px;display:flex;align-items:center;justify-content:space-between;
  padding:0 12px;background:#fff;position:sticky;top:0;z-index:15;flex-shrink:0;
}
.navbar .back{width:30px;height:30px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.navbar .title{font-size:16.5px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%)}
.navbar .right{font-size:13px;color:var(--t2);cursor:pointer;min-width:30px;text-align:right}

/* 底部 tabbar */
.tabbar{
  position:absolute;bottom:0;left:0;right:0;height:56px;background:#fff;
  border-top:1px solid var(--line);display:flex;z-index:25;padding-bottom:0;
}
.tabbar .tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;color:var(--t3)}
.tabbar .tab.on{color:var(--t1)}
.tabbar .tab span{font-size:10px}
.tabbar .tab.on span{font-weight:600}
.tab-pub{
  position:absolute;top:-19px;left:50%;transform:translateX(-50%);
  width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--xy),var(--xy-deep));
  display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(255,179,0,.45);
  cursor:pointer;z-index:26;
}
.has-tabbar{padding-bottom:60px !important}

/* 通用组件 */
.row{display:flex;align-items:center}
.between{display:flex;align-items:center;justify-content:space-between}
.card{background:#fff;border-radius:var(--radius)}
.mb8{margin-bottom:8px}
.p12{padding:12px}
.grow{flex:1}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ell2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{
  border:none;border-radius:22px;font-size:15px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;justify-content:center;height:44px;
}
.btn-y{background:linear-gradient(135deg,var(--xy),var(--xy-deep));color:#3D2B00}
.btn-r{background:linear-gradient(135deg,#FF5A4D,var(--red));color:#fff}
.btn-o{border:1px solid #DDD;background:#fff;color:var(--t2);font-weight:500}
.btn-full{width:100%}
.btn-s{height:32px;border-radius:16px;font-size:13px;padding:0 16px}
.tag{font-size:10px;padding:1px 5px;border-radius:3px;background:var(--xy-light);color:#9A6E00;flex-shrink:0}
.tag-r{background:#FFECEC;color:var(--red)}
.tag-g{background:#EAF7EE;color:#2E9E52}
.tag-b{background:#EAF1FF;color:#3C6FF5}
.price{color:var(--red);font-weight:700}
.price small{font-size:11px;font-weight:600;margin-right:1px}
.av{background:linear-gradient(135deg,#DDE2EA,#C7CFDB);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0;overflow:hidden}
.thumb{position:relative;overflow:hidden;background:#EFEFEF;display:flex;align-items:center;justify-content:center}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:2}
.thumb .emo{font-size:38px;z-index:1;opacity:.85}
.divider{height:8px;background:var(--bg)}
.hair{height:1px;background:var(--line)}
.mask{
  position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:40;
  display:flex;align-items:flex-end;
}
.sheet{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:18px 16px 26px}
.pill{font-size:12px;padding:5px 12px;border-radius:14px;background:#F3F4F6;color:var(--t2);cursor:pointer;white-space:nowrap}
.pill.on{background:var(--xy);color:#4A3400;font-weight:600}
/* 骨架屏与加载 */
.sk{background:linear-gradient(90deg,#EDEEF1 25%,#F7F8FA 37%,#EDEEF1 63%);background-size:400% 100%;animation:sk 1.25s ease-in-out infinite;border-radius:4px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
.spin{width:17px;height:17px;border-radius:50%;border:2.2px solid #E3E5E9;border-top-color:var(--xy-deep);animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
/* 状态切换器 */
.statebar{display:flex;gap:6px;padding:8px 10px;background:#fff;overflow-x:auto;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.statebar .pill{font-size:11.5px;padding:5px 11px;flex-shrink:0}
.statebar::after{content:'';flex-shrink:0;width:2px}

/* ============ 右侧说明 ============ */
.notes{
  width:302px;background:#fff;border-left:1px solid #E3E6EC;overflow-y:auto;
  padding:20px 20px 40px;flex-shrink:0;
}
.nt-tag{display:inline-block;font-size:11px;background:var(--xy-light);color:#9A6E00;padding:3px 9px;border-radius:5px;font-weight:600}
.nt-h{font-size:18px;font-weight:700;margin:10px 0 4px}
.nt-sub{font-size:12.5px;color:var(--t2);line-height:1.75;margin-bottom:16px}
.nt-sec{margin-top:18px}
.nt-sec h4{
  font-size:12px;color:var(--t3);letter-spacing:1px;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.nt-sec h4::before{content:'';width:3px;height:11px;background:var(--xy);border-radius:2px}
.nt-sec ul{list-style:none}
.nt-sec li{
  font-size:12.5px;color:#444;line-height:1.7;padding-left:13px;position:relative;margin-bottom:5px;
}
.nt-sec li::before{content:'';position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:#D0D3DA}
.nt-states{display:flex;flex-wrap:wrap;gap:5px}
.nt-states span{font-size:11px;background:#F5F6F8;color:#555;padding:3px 8px;border-radius:4px}
.nt-flow{font-size:11.5px;background:#FAFBFC;border:1px dashed #DDE1E8;border-radius:8px;padding:10px;line-height:1.9;color:#555}

@media(max-width:1240px){.notes{display:none}}
@media(max-width:900px){.sidebar{width:0;overflow:hidden;border:none}}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-head">
    <div class="sb-logo">
      <div class="mark">🐟</div>
      <div>
        <b>闲置集</b>
        <span>二手交易小程序 · 原型 V1.0</span>
      </div>
    </div>
  </div>
  <div class="sb-body" id="nav"></div>
  <div class="sb-foot">
    参考产品：闲鱼<br>
    画布 375 × 812 · 17 页<br>
    点击手机内元素可跳转
  </div>
</aside>

<main class="stage">
  <div class="stage-tip">💡 点击手机屏幕内的按钮、商品卡片、底部导航可跳转页面</div>
  <div class="phone">
    <div class="screen" id="screen"></div>
  </div>
</main>

<aside class="notes" id="notes"></aside>

<script>
/* ==================== 数据 ==================== */
const IMG = (seed,emo)=>`<div class="thumb"><span class="emo">${emo}</span><img src="https://picsum.photos/seed/${seed}/400/400" onerror="this.remove()" alt=""></div>`;

const ITEMS = [
 {id:1,t:'iPhone 14 Pro 256G 暗紫色 国行',p:4380,o:8999,c:'几乎全新',city:'杭州 · 西湖区',like:236,emo:'📱',s:'数码控小明',g:'#E8ECF3,#C7D0DE'},
 {id:2,t:'索尼 A7M4 全画幅微单 快门 8000 次',p:12800,o:16999,c:'95新',city:'上海 · 徐汇区',like:89,emo:'📷',s:'摄影老张',g:'#F0EAE0,#D8C9B4'},
 {id:3,t:'Nintendo Switch OLED 白色主机 + 3 游戏',p:1380,o:2099,c:'9成新',city:'北京 · 朝阳区',like:412,emo:'🎮',s:'游戏仓鼠',g:'#EAF0E9,#C4D6C2'},
 {id:4,t:'MUJI 无印良品 橡木书桌 110cm',p:320,o:1299,c:'8成新',city:'杭州 · 拱墅区',like:57,emo:'🪑',s:'搬家清仓',g:'#F2EDE6,#DCCDBA'},
 {id:5,t:'LV 老花 neverfull MM 手袋 全套包装',p:6800,o:12800,c:'9成新',city:'深圳 · 南山区',like:1032,emo:'👜',s:'薇薇的衣橱',g:'#F5E8E8,#DEC3C3'},
 {id:6,t:'Kindle Paperwhite 5 signature 32G',p:520,o:1399,c:'几乎全新',city:'成都 · 武侯区',like:178,emo:'📚',s:'读书人阿May',g:'#E9EDF2,#C9D3DE'},
 {id:7,t:'戴森 V12 吸尘器 全套配件 带发票',p:1580,o:3990,c:'9成新',city:'广州 · 天河区',like:246,emo:'🧹',s:'家电小铺',g:'#EDEAF2,#CFC8DE'},
 {id:8,t:'Nike Air Force 1 白 42.5 码 轻微穿着',p:180,o:799,c:'8成新',city:'武汉 · 江汉区',like:64,emo:'👟',s:'球鞋老炮',g:'#F1EFE8,#D5D0C0'},
 {id:9,t:'星巴克城市限定马克杯 8 只打包',p:260,o:600,c:'全新',city:'南京 · 鼓楼区',like:391,emo:'☕',s:'杯子收藏家',g:'#EAF0EC,#C6D8CC'},
 {id:10,t:'乐高 42115 兰博基尼 已拼 带说明书',p:2100,o:3899,c:'已拼完',city:'苏州 · 姑苏区',like:520,emo:'🧱',s:'积木狂魔',g:'#F2E9E4,#DCC5B8'},
 {id:11,t:'iPad Air 5 64G WIFI 深空灰 送笔',p:2650,o:4399,c:'95新',city:'西安 · 雁塔区',like:143,emo:'💻',s:'学生党出闲置',g:'#E8EAEE,#C6CBD4'},
 {id:12,t:'宜家 MARKUS 人体工学办公椅 可自提',p:280,o:1099,c:'8成新',city:'杭州 · 滨江区',like:38,emo:'🪑',s:'阿杰搬家',g:'#F0EFE9,#D6D2C4'}
];
const CATS = [['📱','手机数码'],['👗','女装男装'],['🏠','家居家电'],['📚','图书文具'],['🎮','潮流玩具'],['⚽','运动户外'],['🍼','母婴用品'],['💄','美妆个护'],['🚲','出行代步'],['🐱','宠物用品']];
const HOT = ['iPhone 15','Switch 游戏卡','考研资料','相机镜头','露营装备','显示器','机械键盘','婴儿推车'];

/* ==================== 小组件 ==================== */
const sb = dark => `<div class="statusbar${dark?' dark':''}">
  <span>23:07</span>
  <div class="icons">
    <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
    <svg width="16" height="11" viewBox="0 0 16 11" fill="currentColor"><path d="M8 9.6 6 7.4a2.9 2.9 0 0 1 4 0L8 9.6Zm0-3.3a4.6 4.6 0 0 0-3.2 1.3L3.6 6.2a6.5 6.5 0 0 1 8.8 0l-1.2 1.4A4.6 4.6 0 0 0 8 6.3Zm0-3a7.7 7.7 0 0 0-5.3 2L1.5 4A9.6 9.6 0 0 1 8 1.3 9.6 9.6 0 0 1 14.5 4l-1.2 1.3A7.7 7.7 0 0 0 8 3.3Z"/></svg>
    <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><path d="M23 4v4a2.2 2.2 0 0 0 0-4Z" fill="currentColor" opacity=".5"/></svg>
  </div></div>`;

const tabbar = (cur='home') => {
  const T = [['home','首页','M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z'],
             ['circle','圈子','M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm0 4a5 5 0 1 1 0 10 5 5 0 0 1 0-10Z'],
             ['message','消息','M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H8l-4 4V5a1 1 0 0 1 1-1Z'],
             ['mine','我的','M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4 0-7 2-7 4.5V20h14v-1.5C19 16 16 14 12 14Z']];
  let h = '<div class="tabbar">';
  T.forEach((t,i)=>{
    if(i===2) h += `<div class="tab-pub" onclick="go('publish')"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3D2B00" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>`;
    h += `<div class="tab${cur===t[0]?' on':''}" onclick="go('${t[0]}')">
      <svg width="23" height="23" viewBox="0 0 24 24" fill="${cur===t[0]?'#1A1A1A':'none'}" stroke="${cur===t[0]?'#1A1A1A':'#9A9A9A'}" stroke-width="1.7" stroke-linejoin="round"><path d="${t[2]}"/></svg>
      <span>${t[1]}</span></div>`;
  });
  return h+'</div>';
};

const nav = (title,right='',back=true) => `<div class="navbar">
  ${back?`<div class="back" onclick="back()"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></div>`:'<div style="width:30px"></div>'}
  <div class="title">${title}</div>
  <div class="right" ${right&&right.includes('onclick')?'':''}>${right||''}</div></div>`;

const cardItem = it => `<div class="card" style="overflow:hidden" onclick="go('detail')">
  <div style="height:180px;background:linear-gradient(135deg,${it.g})">${IMG('it'+it.id,it.emo)}</div>
  <div style="padding:8px 9px 10px">
    <div class="ell2" style="font-size:13px;line-height:1.42;height:37px">${it.t}</div>
    <div class="row" style="gap:5px;margin:6px 0 5px">
      <span class="price" style="font-size:17px"><small>¥</small>${it.p}</span>
      <span style="font-size:10.5px;color:var(--t4);text-decoration:line-through">¥${it.o}</span>
      <span class="tag" style="margin-left:auto">${it.c}</span>
    </div>
    <div class="between" style="font-size:11px;color:var(--t3)">
      <div class="row" style="gap:3px"><div class="av" style="width:15px;height:15px">${it.s[0]}</div><span class="ell" style="max-width:78px">${it.s}</span></div>
      <span>♡ ${it.like}</span>
    </div>
  </div></div>`;

/* ==================== 页面集合 ==================== */
const P = [];
const add = o => { if(o.tabs && !o.render) o.render = function(){ return renderTabs(o); }; P.push(o); };
function renderTabs(p){
  return `<div class="page on">
    <div class="statebar">${p.tabs.map((t,i)=>`<div class="pill spill${i===0?' on':''}" onclick="switchTab('${p.id}',${i})">${t.name}</div>`).join('')}</div>
    <div id="stateBody">${p.tabs[0].html}</div>
  </div>`;
}
function switchTab(id,i){
  const p = P.find(x=>x.id===id);
  const box = document.getElementById('stateBody');
  if(box && p) box.innerHTML = p.tabs[i].html;
  document.querySelectorAll('#screen .spill').forEach((el,j)=> el.classList.toggle('on', j===i));
}

/* ---------- 1 登录授权 ---------- */
add({id:'login',group:'入口与发现',name:'登录授权',sub:'微信一键授权是小程序唯一的低摩擦入口，手机号与实人认证后置到下单、提现等敏感环节，避免首屏流失。',
goal:'完成用户身份建立并获取必要授权，为个性化推荐与交易闭环提供账户基础。',
els:['品牌 Logo + Slogan：强化"闲置循环"心智','微信授权登录主按钮（唯一主 CTA）','手机号登录次入口','用户协议 / 隐私政策勾选（合规必须）','底部"游客浏览"低权重入口'],
inter:['点击「微信一键登录」→ 调起 wx.login + getUserProfile → 换取 token','未勾选协议点击登录 → Toast"请先阅读并同意协议" + 协议文字高亮抖动','已授权用户下次进入直接静默登录，跳过本页','授权失败 → 展示重新授权按钮与客服入口'],
states:['未登录','授权中','授权成功','授权失败','协议未勾选','黑名单用户'],
flow:'进入 → 勾选协议 → 微信授权 → 创建/绑定账户 → 首页',
render:()=>`<div class="page on" style="background:linear-gradient(165deg,#FFE9A8,#FFCE3D 42%,#FFB300)">

 <div class="card mb8" style="margin:0 12px;padding:12px">
   <div class="row" style="gap:10px">
     <div style="width:56px;height:56px;border-radius:8px;background:linear-gradient(135deg,#E9EDF2,#C9D3DE);display:flex;align-items:center;justify-content:center;font-size:24px">📚</div>
     <div class="grow"><div style="font-size:13.5px" class="ell">Kindle Paperwhite 5 signature 32G</div><div style="font-size:11.5px;color:var(--t3);margin-top:4px">几乎全新 · 包邮</div></div>
   </div>
 </div>
 <div style="padding:14px 14px 0;display:flex;flex-direction:column;gap:10px">
   <div class="btn btn-y" style="width:100%;height:44px;font-size:15px" onclick="go('order-detail')">查看订单</div>

     <div class="btn btn-o grow" style="height:42px;font-size:14px" onclick="go('home')">继续逛逛</div>

/* ==================== 引擎 ==================== */
const screen = document.getElementById('screen');
const navBox = document.getElementById('nav');
const notesBox = document.getElementById('notes');
let stack = [];

let navHtml = '', g = '';
P.forEach((p,i)=>{
  if(p.group !== g){ g = p.group; navHtml += `<div class="sb-group">${g}</div>`; }
  navHtml += `<div class="sb-item" data-id="${p.id}"><span class="n">${i+1}</span>${p.name}</div>`;
});
navBox.innerHTML = navHtml;
navBox.querySelectorAll('.sb-item').forEach(el=>{ el.onclick = ()=> go(el.dataset.id); });

function render(id){
  const p = P.find(x=>x.id===id) || P[0];
  screen.innerHTML = p.render();
  stack.push(id);
  if(stack.length>8) stack.shift();
  navBox.querySelectorAll('.sb-item').forEach(el=> el.classList.toggle('on', el.dataset.id===id));
  const el = navBox.querySelector('.sb-item.on');
  if(el) el.scrollIntoView({block:'nearest'});
  notesBox.innerHTML = `
    <span class="nt-tag">${p.group}</span>
    <div class="nt-h">${p.name}</div>
    <div class="nt-sub">${p.sub}</div>
    <div class="nt-sec"><h4>页面目标</h4><ul><li>${p.goal}</li></ul></div>
    <div class="nt-sec"><h4>核心元素</h4><ul>${p.els.map(e=>`<li>${e}</li>`).join('')}</ul></div>
    <div class="nt-sec"><h4>交互说明</h4><ul>${p.inter.map(e=>`<li>${e}</li>`).join('')}</ul></div>
    <div class="nt-sec"><h4>状态清单</h4><div class="nt-states">${p.states.map(s=>`<span>${s}</span>`).join('')}</div></div>
    ${p.tabs?`<div class="nt-sec"><h4>状态切换演示</h4><div class="nt-flow">点击下方手机顶部的标签可切换状态，共 ${p.tabs.length} 种：<br><b>${p.tabs.map(t=>t.name).join(' / ')}</b></div></div>`:''}
    <div class="nt-sec"><h4>流程</h4><div class="nt-flow">${p.flow}</div></div>`;
  notesBox.scrollTop = 0;
}
function go(id){ render(id); }
function back(){
  stack.pop();
  const prev = stack[stack.length-1] || 'home';
  stack.pop();
  render(prev);
}
render('login');
window.onerror = (m,s,l)=>{ screen.innerHTML = `<div style="padding:30px;font-size:13px;color:#c00">页面渲染异常：${m}<br>行 ${l}</div>`; };
</script>
</body>
