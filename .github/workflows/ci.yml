name: CI

# F-03 测试与 CI：默认 local profile 走真实 MySQL（application.yml 默认数据源），
# 由本工作流 provision 一个 MySQL 8.0 服务容器，使 @SpringBootTest 集成测试（ApiIntegrationTest /
# SubsystemSmokeTest）也能跑全量；纯 Mockito 单测（CouponServiceTest / PayCallbackTest /
# SimpleRateLimiterTest 等）同样在此环境执行。
# 说明：当前 git 仓库根为会话目录，业务模块位于 idlefish-backend/ 子目录；
# 若后续将 idlefish-backend 作为独立仓库推送，请将本文件迁移至 idlefish-backend/.github/workflows/ci.yml
# 并将下方 working-directory 改为 . 或删除。

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idlefish-backend
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: idlefish
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1; then
              echo "MySQL is up"; break
            fi
            echo "Waiting for MySQL... ($i)"; sleep 2
          done

      - name: Build and test (MySQL-backed full suite)
        run: mvn -B -ntp test

  # F-15.3 容器化：仅构建镜像验证 Dockerfile 可构建（不实际 push，避免缺凭证失败）。
  # 推送 registry 需凭据就绪后启用下方 push-image 段（见注释）。
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (verify only)
        uses: docker/build-push-action@v6
        with:
          context: ./idlefish-backend
          push: false
          tags: idlefish-backend:ci
          # 离线缓存目录在 CI 不可用时联网拉取；本地 .m2 不进入构建上下文（.dockerignore 已排除）
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- 推送模板（凭据就绪后启用） ----
