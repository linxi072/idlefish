server:
  # 端口可经环境变量 PORT 覆盖（生产容器化部署常用），缺省仍为 8080（D-21 配置安全治理）
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/idlefish?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data-mysql.sql
  jackson:
    default-property-inclusion: non_null
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# 零依赖可观测性：traceId / orderId / bizNo 透传至日志（MDC），HTTP 请求指标在 /actuator/metrics 暴露
# orderId/bizNo 由资金链路关键动作（支付/结算/提现/退款）经 TraceContext 注入，便于按单检索（REQ-02）。
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level traceId=%X{traceId:-} orderId=%X{orderId:-} bizNo=%X{bizNo:-} %logger{36} - %msg%n"
  level:
    root: INFO

# Actuator / Micrometer（F-12.6）：仅在 micrometer profile 激活时引入 actuator 依赖后生效；
# 默认离线构建无 actuator，以下配置被忽略，不影响编译与运行。
# /actuator/** 已在 WebConfig 放行鉴权，便于 Prometheus 直接抓取（生产建议网关收敛为内网）。
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# 业务自定义配置
idlefish:
  jwt:
    # 生产环境务必替换为高强度密钥（>= 32 字节）并通过环境变量 JWT_SECRET 注入，切勿明文提交
    secret: "${JWT_SECRET:ZzVNhe08kvOb3DHdclHpMsMKXZsoPty-dOWYNiqxhNTxpmhKf7sb1wlx2FcYYG7P}"
    expire-seconds: 86400
    refresh-seconds: 2592000
  cookie:
    # HTTPS 生产环境置 true；经 IDLEFISH_COOKIE_SECURE=true 注入（F-04 JWT→Cookie）
    secure: ${IDLEFISH_COOKIE_SECURE:false}
  ratelimit:
    # 请求限流骨架；生产经 IDLEFISH_RATELIMIT_ENABLED=true 开启（F-04 安全加固）
    enabled: ${IDLEFISH_RATELIMIT_ENABLED:false}
    permits-per-minute: 200
  observability:
    # 零依赖可观测性总开关：HTTP traceId + 请求指标 + 业务指标
    enabled: ${IDLEFISH_OBSERVABILITY_ENABLED:true}
    # 阈值告警（F-12.3）：慢请求 / 错误率 / 支付验签失败
    alert-enabled: ${IDLEFISH_OBSERVABILITY_ALERT_ENABLED:true}
    alert-admin-user-id: ${IDLEFISH_OBSERVABILITY_ALERT_ADMIN:1}
    slow-request-ms: ${IDLEFISH_OBSERVABILITY_SLOW_MS:1000}
    error-rate-threshold: ${IDLEFISH_OBSERVABILITY_ERR_RATE:0.05}
    verify-failure-threshold: ${IDLEFISH_OBSERVABILITY_VERIFY_FAIL:5}
    cooldown-minutes: ${IDLEFISH_OBSERVABILITY_COOLDOWN:30}
    # 监控端点收敛令牌（T01 内网收敛）：内网之外访问 /actuator/prometheus|metrics|env 须携带
    # X-Actuator-Token；留空则仅依赖内网 IP 收敛。生产经 IDLEFISH_OBSERVABILITY_ACTUATOR_TOKEN 注入。
    actuator-token: "${IDLEFISH_OBSERVABILITY_ACTUATOR_TOKEN:}"
    # 卡单守卫窗口（分钟，T01 防御网）：超时未支付订单超过该时长仍未关单则告警（REQ-06）
    stuck-order-minutes: ${IDLEFISH_OBSERVABILITY_STUCK_MIN:30}
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    password:
    timeout-ms: 3000
  login:
    # 真实微信登录（jscode2session）；AppID/Secret 必须经环境变量注入
    appid: "${IDLEFISH_LOGIN_APPID:}"        # 微信小程序 AppID
    secret: "${IDLEFISH_LOGIN_SECRET:}"      # 微信小程序 AppSecret（生产务必走环境变量，切勿明文提交）
  pay:
    # 真实微信支付 v3（JSAPI 下单 / 退款 / 分账 / 回调验签解密），凭据经环境变量注入
    mchid: "${IDLEFISH_PAY_MCHID:}"
    appid: "${IDLEFISH_PAY_APPID:}"
    serial-no: "${IDLEFISH_PAY_SERIAL:}"
    private-key: "${IDLEFISH_PAY_PRIVATE_KEY:}"
    api-v3-key: "${IDLEFISH_PAY_APIV3_KEY:}"
    notify-url: "${IDLEFISH_PAY_NOTIFY_URL:}"
    gateway: "https://api.mch.weixin.qq.com"
  search:
    hosts:              # 真实 Elasticsearch 节点
      - "http://127.0.0.1:9200"
    index: "idlefish_item"
  mq:
    # 真实 RocketMQ（阿里云 HTTP 接入点）
    endpoint: "${IDLEFISH_MQ_ENDPOINT:}"
    access-key: "${IDLEFISH_MQ_AK:}"
    secret-key: "${IDLEFISH_MQ_SK:}"
    instance-id: "${IDLEFISH_MQ_INSTANCE:}"
    topic: "idlefish_delay"
    group: "idlefish_delay_grp"
  audit:
    # 真实阿里云内容安全（绿网）机审
  logistics:
    # 真实物流查询（快递100 / 菜鸟）
    provider: "kuaidi100"
    customer: "${IDLEFISH_LOGI_CUSTOMER:}"
    key: "${IDLEFISH_LOGI_KEY:}"
    url: "https://poll.kuaidi100.com/poll/query.do"
  oss:
    endpoint: "${IDLEFISH_OSS_ENDPOINT:}"
    bucket: "${IDLEFISH_OSS_BUCKET:}"
    region: "cn-hangzhou"
    access-key: "${IDLEFISH_OSS_AK:}"
    secret-key: "${IDLEFISH_OSS_SK:}"
    base-url: "/uploads/"
  risk:
    device-enabled: true
    high-amount-threshold-fen: 5000000
    device-account-threshold: 3
    device-order-rate: 10
    device-order-window-min: 1
    blacklist-device-ids: []
  notify:
    # 实时 WebSocket 推送是否启用（本地 WS 即真实通道，无需外部凭据）
    push-enabled: ${IDLEFISH_NOTIFY_PUSH_ENABLED:true}
    sms:
      enabled: ${IDLEFISH_NOTIFY_SMS_ENABLED:false}
      sign-name: "${IDLEFISH_NOTIFY_SMS_SIGN:}"
      template-code: "${IDLEFISH_NOTIFY_SMS_TEMPLATE:}"
      access-key: "${IDLEFISH_NOTIFY_SMS_AK:}"
      secret-key: "${IDLEFISH_NOTIFY_SMS_SK:}"
      endpoint: "${IDLEFISH_NOTIFY_SMS_ENDPOINT:}"
  credit:
    # F-06 信用评分权重（与 CreditCalculator 默认值一致，可在此覆盖）
    real-name: 10          # 实名认证加分
    age-per-30d: 2         # 每满 30 天注册时长加分
    age-cap: 20            # 注册时长加分封顶
    fulfillment: 40        # 履约率权重（完成订单 / 总订单）
    review: 30             # 好评率权重（好评数 / 总评价数）
    review-baseline: 15    # 无评价时的好评基线分
    ban-penalty: 30        # 封禁扣分
    risk-per-event: 5      # 单条高风险事件扣分
    risk-cap: 30           # 风控扣分封顶
  local:
    # 同城回收与本地履约（ITER-F05）。金额单位一律「分」。
    # 总开关：关闭后所有同城/回收入口明确提示未开通，不做静默降级（REQ-09）
    enabled: ${IDLEFISH_LOCAL_ENABLED:true}
    # 开通同城服务的城市清单（REQ-01/REQ-09）；留空表示不限制，生产建议显式列举以便边界明确
    cities: []
    # 一键回收白名单类目 ID（REQ-11）；留空表示不限制
    recycle-categories: []
    condition-ratio:                  # 成色档位 → 回收价折扣系数（1 全新 ~ 5 功能完好）
      1: 0.85
      2: 0.75
      3: 0.62
      4: 0.48
      5: 0.35
    default-estimate-ratio: ${IDLEFISH_LOCAL_DEFAULT_RATIO:0.6}      # 无成色命中时兜底比例
    min-estimate-fen: ${IDLEFISH_LOCAL_MIN_FEN:100}                  # 回收估价下限（分），防 0 元单
    max-quote-drop-ratio: ${IDLEFISH_LOCAL_MAX_DROP:0.5}             # 质检跌价超该比例需人工复核（REQ-04）
    self-pickup-confirm-days: ${IDLEFISH_LOCAL_SELF_PICKUP_DAYS:3}   # 自提订单自动确认收货天数（REQ-10）
    delivery-base-fee-fen: ${IDLEFISH_LOCAL_BASE_FEE:600}            # 同城配送起步价（分）
    delivery-base-km: ${IDLEFISH_LOCAL_BASE_KM:3.0}                  # 起步里程（公里）
    delivery-per-km-fen: ${IDLEFISH_LOCAL_PER_KM:200}                # 超里程每公里费用（分）
    delivery-max-km: ${IDLEFISH_LOCAL_MAX_KM:30.0}                   # 最大承接距离，超出判定不可用（REQ-09）
    provider:
      # 第三方同城配送服务商（真实 HTTP）。未启用或凭据缺失时创建配送返回「服务暂不可用」（REQ-09）
      enabled: ${IDLEFISH_LOCAL_PROVIDER_ENABLED:false}
      name: "${IDLEFISH_LOCAL_PROVIDER_NAME:local-provider}"
      base-url: "${IDLEFISH_LOCAL_PROVIDER_BASE_URL:}"
      app-key: "${IDLEFISH_LOCAL_PROVIDER_APP_KEY:}"
      app-secret: "${IDLEFISH_LOCAL_PROVIDER_APP_SECRET:}"
      timeout-ms: ${IDLEFISH_LOCAL_PROVIDER_TIMEOUT:3000}

  search-service:
    # 搜推服务化（ITER-T04）：双模式路由 + 熔断降级 + 资源隔离 + 索引同步滞后监控。
    # mode=inline（默认）：进程内执行，行为与拆分前一致；mode=remote：HTTP 调用独立搜推服务（/sr/api/**）
    enabled: ${IDLEFISH_SEARCH_SERVICE_ENABLED:true}
    mode: ${IDLEFISH_SEARCH_SERVICE_MODE:inline}
    # 远程模式：搜推服务基址与服务间令牌（X-Service-Token）；服务端未配置令牌时 fail-closed 拒绝（REQ-09）
    base-url: "${IDLEFISH_SEARCH_SERVICE_BASE_URL:}"
    service-token: "${IDLEFISH_SEARCH_SERVICE_TOKEN:}"
    timeout-ms: ${IDLEFISH_SEARCH_SERVICE_TIMEOUT:2000}        # 远程读取超时 / 隔离池任务总超时（毫秒）
    connect-timeout-ms: ${IDLEFISH_SEARCH_SERVICE_CONNECT_TIMEOUT:500}
    failure-threshold: ${IDLEFISH_SEARCH_SERVICE_FAILURE_THRESHOLD:5}   # 连续失败达阈值即熔断（REQ-08）
    open-duration-ms: ${IDLEFISH_SEARCH_SERVICE_OPEN_MS:10000}          # 熔断持续时长，到期半开探测
    core-pool-size: ${IDLEFISH_SEARCH_SERVICE_CORE_POOL:8}              # 隔离线程池（REQ-09）
    max-pool-size: ${IDLEFISH_SEARCH_SERVICE_MAX_POOL:32}
    queue-capacity: ${IDLEFISH_SEARCH_SERVICE_QUEUE:256}
    sync-enabled: ${IDLEFISH_SEARCH_SERVICE_SYNC:true}         # 商品变更经 RocketMQ 异步同步（REQ-02）
    lag-alert-seconds: ${IDLEFISH_SEARCH_SERVICE_LAG_ALERT:60} # 索引滞后告警阈值（秒，REQ-07）
    alert-admin-user-id: ${IDLEFISH_SEARCH_SERVICE_ALERT_ADMIN:}  # 滞后告警接收者；空则回退 notify.alert-admin-user-id
