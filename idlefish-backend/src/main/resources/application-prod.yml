# 生产 Profile（mvn -Pprod 构建后，以 --spring.profiles.active=prod 启动）
# 数据源切换为 MySQL，SQL 初始化切换为 MySQL 语法 DDL；缓存切换为 Redis。
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/idlefish?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data-mysql.sql

idlefish:
  redis:
    host: 127.0.0.1
    port: 6379
    database: 0
    password:
    timeout-ms: 3000
