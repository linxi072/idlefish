# 生产 Profile（mvn -Pprod 构建后，以 --spring.profiles.active=prod 启动）
# 数据源切换为 MySQL，SQL 初始化切换为 MySQL 语法 DDL；缓存切换为 Redis。
spring:
  datasource:
    url: jdbc:mysql://${IDLEFISH_MYSQL_HOST:127.0.0.1}:${IDLEFISH_MYSQL_PORT:3306}/${IDLEFISH_MYSQL_DB:idlefish}?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${IDLEFISH_MYSQL_USER:root}
    password: ${IDLEFISH_MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-mysql.sql
      data-locations: classpath:db/data-mysql.sql

idlefish:
  cache:
    type: redis
  redis:
    host: ${IDLEFISH_REDIS_HOST:127.0.0.1}
    port: ${IDLEFISH_REDIS_PORT:6379}
    database: ${IDLEFISH_REDIS_DB:0}
    password: ${IDLEFISH_REDIS_PASSWORD:}
    timeout-ms: 3000
