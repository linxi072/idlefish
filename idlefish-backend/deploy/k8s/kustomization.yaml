# idlefish-backend · Kustomize 入口（T07）
# 通过 `kubectl apply -k deploy/k8s` 或 Argo CD（path=deploy/k8s）统一交付。
# 注意：secret.yaml 为占位模板，部署前须以真实密钥替换（见 secret.yaml 头部说明）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: idlefish

resources:
  - configmap.yaml
  - secret.yaml
  - service.yaml
  - deployment.yaml
  - hpa.yaml
  - poddisruptionbudget.yaml

# 生产可在 overlay 中通过 images 字段替换 registry 与 tag：
# images:
#   - name: idlefish-backend
#     newName: registry.example.com/idlefish/idlefish-backend
#     newTag: "1.0.0"
