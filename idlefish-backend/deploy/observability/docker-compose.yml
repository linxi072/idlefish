version: "3.8"

# 可观测性生产化工具链（T01）：应用 + Prometheus + Alertmanager + Grafana
# 启动：docker compose -f deploy/observability/docker-compose.yml up -d
# 说明：
#   - 应用需以 micrometer profile 运行（暴露 /actuator/prometheus），零依赖内核指标经
#     MicrometerMetricsBridge 桥接为 idlefish_* 系列 Gauge。
#   - 不激活 micrometer 时，应用仍由零依赖 ObservabilityController 暴露 /actuator/health 与
#     /actuator/metrics（自定义 JSON），但 Prometheus 无法抓取（REQ-01 默认门控）。

services:
  idlefish-backend:
    image: idlefish-backend:1.0.0
    container_name: idlefish-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: "micrometer,docker"
      JAVA_OPTS: "-Xms512m -Xmx1024m -XX:+UseG1GC"
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,metrics,prometheus"
    # 生产需接入真实 MySQL / Redis；此处省略，请按 docker profile 数据源配置补齐后再编排。
    networks: [obs]

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prom_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks: [obs]

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    networks: [obs]

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus]
    networks: [obs]

networks:
  obs:
    driver: bridge

volumes:
  prom_data:
  grafana_data:
