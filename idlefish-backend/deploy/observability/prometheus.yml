# Prometheus 抓取配置（T01 可观测性生产化）
# 自 T01 起 micrometer profile 默认激活（pom.xml activeByDefault=true），应用启动即暴露
# /actuator/prometheus，无需再显式 -Pmicrometer。docker-compose.yml 沿用 SPRING_PROFILES_ACTIVE
# 显式声明 micrometer 仅为可读性与兼容旧编排，省略该 profile 亦自动激活（REQ-01 默认满足）。
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'idlefish-prod'

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'idlefish-backend'
    metrics_path: '/actuator/prometheus'
    scheme: http
    static_configs:
      - targets: ['idlefish-backend:8080']
        labels:
          service: 'idlefish-backend'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
