# Alertmanager 配置（T01 可观测性生产化）
# 默认通过 webhook 推送；webhook 地址为占位符，请按实际告警网关（如企业微信/钉钉/自研）替换。
global:
  resolve_timeout: 5m

route:
  receiver: 'default-webhook'
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 1h
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:9099/webhook'
        send_resolved: true
  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:9099/webhook/critical'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
